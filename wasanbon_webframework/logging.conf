[loggers]
keys=root

[handlers]
keys=consoleHandler,detailedConsoleHandler, fileHandler

[formatters]
keys=normalFormatter,detailedFormatter

[logger_root]
level=INFO
handlers=fileHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=normalFormatter
args=(sys.stdout,)

[handler_detailedConsoleHandler]
class=StreamHandler
level=DEBUG
formatter=detailedFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=normalFormatter
args=('logfile.log',)

[formatter_normalFormatter]
format=%(asctime)s [%(levelname)-6s] [%(process)d:%(thread)d] [%(name)s] %(funcName)s() L%(lineno)-4d %(message)s

[formatter_detailedFormatter]
format=%(asctime)s [%(levelname)-6s] [%(process)d:%(thread)d] [%(name)s] %(funcName)s() L%(lineno)-4d %(message)s   call_trace=%(pathname)s L%(lineno)-4d
